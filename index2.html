<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Point Cloud Universe & Gesture Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* UI Overlay Cards */
    .ui-panel {
      position: absolute;
      z-index: 10;
      background: rgba(15, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Top Right Filter */
    #filter-panel { top: 20px; right: 20px; width: 220px; }
    #filter-panel h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; color: #a5b4fc; }
    .shape-btn {
      width: 100%;
      padding: 8px 12px;
      margin: 4px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .shape-btn:hover, .shape-btn.active {
      background: #6366f1;
      border-color: #818cf8;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    /* Left Starfield Controllers */
    #control-panel { top: 20px; left: 20px; width: 260px; }
    #control-panel h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; color: #38bdf8; }
    .control-group { margin-bottom: 10px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; color: #cbd5e1; }
    .control-group input[type="range"], .control-group input[type="color"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

    /* Webcam Panel */
    #webcam-panel { bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .toggle-btn {
      padding: 10px 16px;
      background: #22c55e;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }
    .toggle-btn.off { background: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    #webcam-preview {
      width: 140px;
      height: 105px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      object-fit: cover;
      transform: scaleX(-1);
    }
    #gesture-status { font-size: 0.8rem; color: #facc15; font-weight: 600; }
  </style>

  <!-- Three.js & Controls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <!-- MediaPipe Hands & Camera Utility -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <!-- Top Right Shape Selection -->
  <div id="filter-panel" class="ui-panel">
    <h3>Select Model</h3>
    <button class="shape-btn active" onclick="switchShape('donut')">🍩 Donut</button>
    <button class="shape-btn" onclick="switchShape('sun')">☀️ Sun</button>
    <button class="shape-btn" onclick="switchShape('cube')">🧊 Cube</button>
    <button class="shape-btn" onclick="switchShape('pyramid')">🔺 Pyramid</button>
    <button class="shape-btn" onclick="switchShape('heart')">❤️ Heart</button>
    <button class="shape-btn" onclick="switchShape('saturn')">🪐 Saturn</button>
  </div>

  <!-- Left Controls for Background Stars -->
  <div id="control-panel" class="ui-panel">
    <h3>Background Stars</h3>
    <div class="control-group">
      <label>Speed <span id="val-speed">2.0</span></label>
      <input type="range" id="star-speed" min="0" max="10" step="0.1" value="2.0">
    </div>
    <div class="control-group">
      <label>Star Size <span id="val-size">1.2</span></label>
      <input type="range" id="star-size" min="0.1" max="5" step="0.1" value="1.2">
    </div>
    <div class="control-group">
      <label>Star Count <span id="val-count">5000</span></label>
      <input type="range" id="star-count" min="1000" max="15000" step="500" value="5000">
    </div>
    <div class="control-group">
      <label>Star Color</label>
      <input type="color" id="star-color" value="#ffffff">
    </div>
  </div>

  <!-- Bottom Left Webcam Interaction -->
  <div id="webcam-panel" class="ui-panel">
    <button id="webcam-toggle" class="toggle-btn off" onclick="toggleWebcam()">Webcam Gesture: OFF</button>
    <video id="webcam-preview" style="display:none;" autoplay playsinline></video>
    <div id="gesture-status">Status: Disabled</div>
  </div>

  <script>
    const PARTICLE_COUNT = 8000;
    let scene, camera, renderer, controls;
    let mainParticles, mainGeometry, currentPositions, targetPositions;
    let bgStarField, bgStarGeometry, bgStarPositions, bgStarVelocities;
    let webcamActive = false, cameraUtils = null, hands = null;
    let circleTexture;

    // --- HELPER: GENERATE CIRCLE TEXTURE FOR ROUND PARTICLES ---
    function createCircleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(32, 32, 32, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    // --- 1. SETUP THREE.JS SCENE ---
    function init() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 30);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      // Create procedural smooth circle texture
      circleTexture = createCircleTexture();

      // Touchpad / Mouse Orbit Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 1;     // Large zoom-in
      controls.maxDistance = 300;   // Large zoom-out

      // Generate Morphable Point Cloud
      initMainModel();

      // Generate Moving Background Stars
      initBackgroundStars(5000);

      // Listeners
      window.addEventListener('resize', onWindowResize);
      setupUIEventListeners();

      animate();
    }

    // --- 2. MODEL GENERATORS (8,000 Points Each) ---
    function generateShapePoints(type) {
      const coords = new Float32Array(PARTICLE_COUNT * 3);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        let x = 0, y = 0, z = 0;

        if (type === 'donut') {
          const R = 8, r = 3;
          const u = Math.random() * Math.PI * 2;
          const v = Math.random() * Math.PI * 2;
          x = (R + r * Math.cos(v)) * Math.cos(u);
          y = (R + r * Math.cos(v)) * Math.sin(u);
          z = r * Math.sin(v);
        } 
        else if (type === 'sun') {
          const radius = 9;
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const r = radius * Math.cbrt(Math.random());
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.sin(phi) * Math.sin(theta);
          z = r * Math.cos(phi);
        } 
        else if (type === 'cube') {
          const s = 12;
          x = (Math.random() - 0.5) * s;
          y = (Math.random() - 0.5) * s;
          z = (Math.random() - 0.5) * s;
        } 
        else if (type === 'pyramid') {
          const h = 12, base = 12;
          const py = Math.random(); 
          const scale = 1 - py;
          x = (Math.random() - 0.5) * base * scale;
          y = (py - 0.5) * h;
          z = (Math.random() - 0.5) * base * scale;
        } 
        else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2;
          const u = (Math.random() - 0.5) * Math.PI;
          x = 0.6 * (16 * Math.pow(Math.sin(t), 3));
          y = 0.6 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          z = u * 3;
        } 
        else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.4) { // Central sphere
            const r = 5 * Math.cbrt(Math.random());
            const u = Math.random() * Math.PI * 2;
            const v = Math.acos(2 * Math.random() - 1);
            x = r * Math.sin(v) * Math.cos(u);
            y = r * Math.sin(v) * Math.sin(u);
            z = r * Math.cos(v);
          } else { // Rings
            const r = 7 + Math.random() * 7;
            const theta = Math.random() * Math.PI * 2;
            x = r * Math.cos(theta);
            y = (Math.random() - 0.5) * 0.4;
            z = r * Math.sin(theta);
          }
        }

        coords[i * 3] = x;
        coords[i * 3 + 1] = y;
        coords[i * 3 + 2] = z;
      }
      return coords;
    }

    function initMainModel() {
      mainGeometry = new THREE.BufferGeometry();
      currentPositions = generateShapePoints('donut');
      targetPositions = new Float32Array(currentPositions);

      mainGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      const material = new THREE.PointsMaterial({
        color: 0x818cf8,
        size: 0.35,
        map: circleTexture,
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      mainParticles = new THREE.Points(mainGeometry, material);
      scene.add(mainParticles);
    }

    function switchShape(shapeType) {
      document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      targetPositions = generateShapePoints(shapeType);
    }

    // --- 3. BACKGROUND MOVING STARFIELD ---
    function initBackgroundStars(count) {
      if (bgStarField) scene.remove(bgStarField);

      bgStarGeometry = new THREE.BufferGeometry();
      bgStarPositions = new Float32Array(count * 3);
      bgStarVelocities = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        bgStarPositions[i * 3]     = (Math.random() - 0.5) * 400;
        bgStarPositions[i * 3 + 1] = (Math.random() - 0.5) * 400;
        bgStarPositions[i * 3 + 2] = (Math.random() - 0.5) * 400;
        bgStarVelocities[i] = 0.2 + Math.random() * 0.8;
      }

      bgStarGeometry.setAttribute('position', new THREE.BufferAttribute(bgStarPositions, 3));

      const material = new THREE.PointsMaterial({
        color: new THREE.Color(document.getElementById('star-color').value),
        size: parseFloat(document.getElementById('star-size').value),
        map: circleTexture,
        transparent: true,
        opacity: 0.8,
        depthWrite: false
      });

      bgStarField = new THREE.Points(bgStarGeometry, material);
      scene.add(bgStarField);
    }

    // --- 4. GESTURE RECOGNITION (WEB CAM) ---
    function toggleWebcam() {
      const btn = document.getElementById('webcam-toggle');
      const video = document.getElementById('webcam-preview');
      const status = document.getElementById('gesture-status');

      webcamActive = !webcamActive;

      if (webcamActive) {
        btn.classList.remove('off');
        btn.innerText = "Webcam Gesture: ON";
        video.style.display = "block";
        status.innerText = "Status: Initializing AI...";
        startHandTracking();
      } else {
        btn.classList.add('off');
        btn.innerText = "Webcam Gesture: OFF";
        video.style.display = "none";
        status.innerText = "Status: Disabled";
        if (cameraUtils) cameraUtils.stop();
      }
    }

    function startHandTracking() {
      const videoElement = document.getElementById('webcam-preview');
      const status = document.getElementById('gesture-status');

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
          status.innerText = "Status: Searching for hand...";
          return;
        }

        const landmarks = results.multiHandLandmarks[0];
        
        // Calculate average distance between fingertips and wrist (Landmark 0)
        const wrist = landmarks[0];
        const fingertips = [4, 8, 12, 16, 20];
        let totalDist = 0;

        fingertips.forEach(idx => {
          const tip = landmarks[idx];
          const dist = Math.hypot(tip.x - wrist.x, tip.y - wrist.y);
          totalDist += dist;
        });

        const avgDist = totalDist / fingertips.length;

        // Threshold logic: Open Palm vs. Fist
        if (avgDist > 0.35) {
          status.innerText = "Gesture: OPEN PALM ✋ (Zooming In)";
          camera.position.z = Math.max(camera.position.z - 0.4, controls.minDistance);
        } else if (avgDist < 0.22) {
          status.innerText = "Gesture: FIST ✊ (Zooming Out)";
          camera.position.z = Math.min(camera.position.z + 0.4, controls.maxDistance);
        } else {
          status.innerText = "Gesture: Neutral";
        }
      });

      cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          if (webcamActive) await hands.send({ image: videoElement });
        },
        width: 320,
        height: 240
      });

      cameraUtils.start();
    }

    // --- 5. ANIMATION & EVENT HANDLERS ---
    function setupUIEventListeners() {
      document.getElementById('star-speed').addEventListener('input', (e) => {
        document.getElementById('val-speed').innerText = e.target.value;
      });
      document.getElementById('star-size').addEventListener('input', (e) => {
        document.getElementById('val-size').innerText = e.target.value;
        if (bgStarField) bgStarField.material.size = parseFloat(e.target.value);
      });
      document.getElementById('star-count').addEventListener('change', (e) => {
        document.getElementById('val-count').innerText = e.target.value;
        initBackgroundStars(parseInt(e.target.value));
      });
      document.getElementById('star-color').addEventListener('input', (e) => {
        if (bgStarField) bgStarField.material.color.set(e.target.value);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      // Smooth Morphing between shapes (Linear Interpolation)
      const positions = mainGeometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.05;
      }
      mainGeometry.attributes.position.needsUpdate = true;

      // Note: Automatic rotation removed so model stays completely controlled by mouse/touchpad input.

      // Move Background Stars forward along Z axis
      if (bgStarField) {
        const starPos = bgStarGeometry.attributes.position.array;
        const speed = parseFloat(document.getElementById('star-speed').value);

        for (let i = 0; i < starPos.length / 3; i++) {
          starPos[i * 3 + 2] += bgStarVelocities[i] * speed * 0.1;

          // Recycle star when it gets too close
          if (starPos[i * 3 + 2] > 200) {
            starPos[i * 3 + 2] = -200;
            starPos[i * 3]     = (Math.random() - 0.5) * 400;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 400;
          }
        }
        bgStarGeometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
