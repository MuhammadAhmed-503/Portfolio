<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>3D Point Cloud Universe & Gesture Control</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; }

    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    .ui-panel {
      position: absolute;
      z-index: 10;
      background: rgba(15, 20, 30, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    #filter-panel { top: 20px; right: 20px; width: 220px; }
    #filter-panel h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 10px; color: #a5b4fc; }
    .shape-btn {
      width: 100%;
      padding: 8px 12px;
      margin: 4px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
      border-radius: 6px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
    }
    .shape-btn:hover, .shape-btn.active {
      background: #6366f1;
      border-color: #818cf8;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.5);
    }

    #control-panel { top: 20px; left: 20px; width: 260px; }
    #control-panel h3 { font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; color: #38bdf8; }
    .control-group { margin-bottom: 10px; }
    .control-group label { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; color: #cbd5e1; }
    .control-group input[type="range"], .control-group input[type="color"] { width: 100%; accent-color: #38bdf8; cursor: pointer; }

    #webcam-panel { bottom: 20px; left: 20px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
    .toggle-btn {
      padding: 10px 16px;
      background: #22c55e;
      border: none;
      color: #fff;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 0 10px rgba(34, 197, 94, 0.4);
    }
    .toggle-btn.off { background: #ef4444; box-shadow: 0 0 10px rgba(239, 68, 68, 0.4); }
    #webcam-preview {
      width: 140px;
      height: 105px;
      border-radius: 8px;
      border: 2px solid rgba(255,255,255,0.2);
      object-fit: cover;
      transform: scaleX(-1);
    }
    #gesture-status { font-size: 0.8rem; color: #facc15; font-weight: 600; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="filter-panel" class="ui-panel">
    <h3>Select Model</h3>
    <button id="btn-donut" class="shape-btn active" onclick="switchShape('donut')">🍩 Donut (0 Fig)</button>
    <button id="btn-sun" class="shape-btn" onclick="switchShape('sun')">☀️ Sun (1 Fig)</button>
    <button id="btn-cube" class="shape-btn" onclick="switchShape('cube')">🧊 Cube (2 Fig)</button>
    <button id="btn-pyramid" class="shape-btn" onclick="switchShape('pyramid')">🔺 Pyramid (3 Fig)</button>
    <button id="btn-heart" class="shape-btn" onclick="switchShape('heart')">❤️ Heart (4 Fig)</button>
    <button id="btn-saturn" class="shape-btn" onclick="switchShape('saturn')">🪐 Saturn (5 Fig / Palm)</button>
  </div>

  <div id="control-panel" class="ui-panel">
    <h3>Background Stars</h3>
    <div class="control-group">
      <label>Speed <span id="val-speed">2.0</span></label>
      <input type="range" id="star-speed" min="0" max="10" step="0.1" value="2.0">
    </div>
    <div class="control-group">
      <label>Star Size <span id="val-size">1.2</span></label>
      <input type="range" id="star-size" min="0.1" max="5" step="0.1" value="1.2">
    </div>
    <div class="control-group">
      <label>Star Count <span id="val-count">5000</span></label>
      <input type="range" id="star-count" min="1000" max="15000" step="500" value="5000">
    </div>
    <div class="control-group">
      <label>Star Color</label>
      <input type="color" id="star-color" value="#ffffff">
    </div>
  </div>

  <div id="webcam-panel" class="ui-panel">
    <button id="webcam-toggle" class="toggle-btn off" onclick="toggleWebcam()">Webcam Gesture: OFF</button>
    <video id="webcam-preview" style="display:none;" autoplay playsinline></video>
    <div id="gesture-status">Status: Disabled</div>
  </div>

  <script>
    const PARTICLE_COUNT = 8000;
    let scene, camera, renderer, controls;
    let mainParticles, mainGeometry, currentPositions, targetPositions;
    let bgStarField, bgStarGeometry, bgStarPositions, bgStarVelocities;
    let webcamActive = false, cameraUtils = null, hands = null;
    let circleTexture;

    let mouseX = 0, mouseY = 0;
    let targetRotationX = 0, targetRotationY = 0;
    // Constant self-rotation speed, independent of cursor movement.
    // Applied on Y and X so the model keeps tumbling in a consistent
    // direction at all times, not just spinning flatly on one axis.
    let autoRotationSpeedY = 0.006;
    let autoRotationSpeedX = 0.0025;
    let autoRotY = 0, autoRotX = 0;
    let cursorOffsetY = 0, cursorOffsetX = 0;
    let currentActiveShape = 'donut';

    // Debounce state for gesture recognition (prevents single-frame flicker/misreads)
    let pendingShape = 'donut';
    let pendingCount = 0;
    const DEBOUNCE_FRAMES = 4;

    function createCircleTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 64;
      canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const gradient = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      gradient.addColorStop(0, 'rgba(255, 255, 255, 1)');
      gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0.8)');
      gradient.addColorStop(1, 'rgba(255, 255, 255, 0)');

      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.arc(32, 32, 32, 0, Math.PI * 2);
      ctx.fill();

      return new THREE.CanvasTexture(canvas);
    }

    function init() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 30);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      circleTexture = createCircleTexture();

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 1;
      controls.maxDistance = 300;

      initMainModel();
      initBackgroundStars(5000);

      window.addEventListener('mousemove', onMouseMove);
      window.addEventListener('resize', onWindowResize);
      setupUIEventListeners();

      animate();
    }

    function onMouseMove(event) {
      mouseX = (event.clientX / window.innerWidth) * 2 - 1;
      mouseY = -(event.clientY / window.innerHeight) * 2 + 1;

      targetRotationY = mouseX * (Math.PI * 0.75);
      targetRotationX = -mouseY * (Math.PI * 0.5);
    }

    function generateShapePoints(type) {
      const coords = new Float32Array(PARTICLE_COUNT * 3);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        let x = 0, y = 0, z = 0;

        if (type === 'donut') {
          const R = 8, r = 3;
          const u = Math.random() * Math.PI * 2;
          const v = Math.random() * Math.PI * 2;
          x = (R + r * Math.cos(v)) * Math.cos(u);
          y = (R + r * Math.cos(v)) * Math.sin(u);
          z = r * Math.sin(v);
        }
        else if (type === 'sun') {
          const radius = 9;
          const u = Math.random();
          const v = Math.random();
          const theta = u * 2.0 * Math.PI;
          const phi = Math.acos(2.0 * v - 1.0);
          const r = radius * Math.cbrt(Math.random());
          x = r * Math.sin(phi) * Math.cos(theta);
          y = r * Math.sin(phi) * Math.sin(theta);
          z = r * Math.cos(phi);
        }
        else if (type === 'cube') {
          const s = 12;
          x = (Math.random() - 0.5) * s;
          y = (Math.random() - 0.5) * s;
          z = (Math.random() - 0.5) * s;
        }
        else if (type === 'pyramid') {
          const h = 12, base = 12;
          const py = Math.random();
          const scale = 1 - py;
          x = (Math.random() - 0.5) * base * scale;
          y = (py - 0.5) * h;
          z = (Math.random() - 0.5) * base * scale;
        }
        else if (type === 'heart') {
          const t = Math.random() * Math.PI * 2;
          const u = (Math.random() - 0.5) * Math.PI;
          x = 0.6 * (16 * Math.pow(Math.sin(t), 3));
          y = 0.6 * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
          z = u * 3;
        }
        else if (type === 'saturn') {
          if (i < PARTICLE_COUNT * 0.4) {
            const r = 5 * Math.cbrt(Math.random());
            const u = Math.random() * Math.PI * 2;
            const v = Math.acos(2 * Math.random() - 1);
            x = r * Math.sin(v) * Math.cos(u);
            y = r * Math.sin(v) * Math.sin(u);
            z = r * Math.cos(v);
          } else {
            const r = 7 + Math.random() * 7;
            const theta = Math.random() * Math.PI * 2;
            x = r * Math.cos(theta);
            y = (Math.random() - 0.5) * 0.4;
            z = r * Math.sin(theta);
          }
        }

        coords[i * 3] = x;
        coords[i * 3 + 1] = y;
        coords[i * 3 + 2] = z;
      }
      return coords;
    }

    function initMainModel() {
      mainGeometry = new THREE.BufferGeometry();
      currentPositions = generateShapePoints('donut');
      targetPositions = new Float32Array(currentPositions);

      mainGeometry.setAttribute('position', new THREE.BufferAttribute(currentPositions, 3));

      const material = new THREE.PointsMaterial({
        color: 0x818cf8,
        size: 0.35,
        map: circleTexture,
        transparent: true,
        opacity: 0.9,
        depthWrite: false,
        blending: THREE.AdditiveBlending
      });

      mainParticles = new THREE.Points(mainGeometry, material);
      scene.add(mainParticles);
    }

    function switchShape(shapeType) {
      if (currentActiveShape === shapeType) return;
      currentActiveShape = shapeType;

      document.querySelectorAll('.shape-btn').forEach(btn => btn.classList.remove('active'));
      const targetBtn = document.getElementById(`btn-${shapeType}`);
      if (targetBtn) targetBtn.classList.add('active');

      targetPositions = generateShapePoints(shapeType);
    }

    function initBackgroundStars(count) {
      if (bgStarField) scene.remove(bgStarField);

      bgStarGeometry = new THREE.BufferGeometry();
      bgStarPositions = new Float32Array(count * 3);
      bgStarVelocities = new Float32Array(count);

      for (let i = 0; i < count; i++) {
        bgStarPositions[i * 3]     = (Math.random() - 0.5) * 400;
        bgStarPositions[i * 3 + 1] = (Math.random() - 0.5) * 400;
        bgStarPositions[i * 3 + 2] = (Math.random() - 0.5) * 400;
        bgStarVelocities[i] = 0.2 + Math.random() * 0.8;
      }

      bgStarGeometry.setAttribute('position', new THREE.BufferAttribute(bgStarPositions, 3));

      const material = new THREE.PointsMaterial({
        color: new THREE.Color(document.getElementById('star-color').value),
        size: parseFloat(document.getElementById('star-size').value),
        map: circleTexture,
        transparent: true,
        opacity: 0.8,
        depthWrite: false
      });

      bgStarField = new THREE.Points(bgStarGeometry, material);
      scene.add(bgStarField);
    }

    // --- GESTURE RECOGNITION (FIXED) ---
    function toggleWebcam() {
      const btn = document.getElementById('webcam-toggle');
      const video = document.getElementById('webcam-preview');
      const status = document.getElementById('gesture-status');

      webcamActive = !webcamActive;

      if (webcamActive) {
        btn.classList.remove('off');
        btn.innerText = "Webcam Gesture: ON";
        video.style.display = "block";
        status.innerText = "Status: Initializing AI...";
        startHandTracking();
      } else {
        btn.classList.add('off');
        btn.innerText = "Webcam Gesture: OFF";
        video.style.display = "none";
        status.innerText = "Status: Disabled";
        if (cameraUtils) cameraUtils.stop();
      }
    }

    function startHandTracking() {
      const videoElement = document.getElementById('webcam-preview');
      const status = document.getElementById('gesture-status');

      hands = new Hands({
        locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
      });

      hands.setOptions({
        maxNumHands: 1,
        modelComplexity: 1,
        minDetectionConfidence: 0.6,
        minTrackingConfidence: 0.6
      });

      hands.onResults((results) => {
        if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
          status.innerText = "Status: Searching for hand...";
          pendingShape = currentActiveShape;
          pendingCount = 0;
          return;
        }

        const lm = results.multiHandLandmarks[0];

        // Scale reference: wrist(0) -> middle_mcp(9). This normalizes every
        // other distance check against how close the hand is to the camera,
        // which is the main reason gestures used to get misread.
        const palmSize = Math.hypot(lm[0].x - lm[9].x, lm[0].y - lm[9].y) || 0.001;

        const fingerIndices = [
          { tip: 8, pip: 6 },   // Index
          { tip: 12, pip: 10 }, // Middle
          { tip: 16, pip: 14 }, // Ring
          { tip: 20, pip: 18 }  // Pinky
        ];

        let count = 0;
        fingerIndices.forEach(f => {
          if (lm[f.tip].y < lm[f.pip].y) {
            count++;
          }
        });

        // FIXED thumb-extension check (v2).
        // The previous version compared the thumb tip to the index knuckle,
        // which works when the thumb splays sideways but misses a thumb
        // pointing straight up (e.g. a "thumbs up"), because that motion
        // doesn't move the tip away from the index knuckle much.
        // This version instead measures distance from a palm-center point
        // (average of wrist + all four finger knuckles), which increases
        // whenever the thumb extends outward in ANY direction — up, out to
        // the side, diagonally — and stays direction-independent.
        const thumbTip = lm[4], thumbMcp = lm[2];
        const palmCenter = {
          x: (lm[0].x + lm[5].x + lm[9].x + lm[13].x + lm[17].x) / 5,
          y: (lm[0].y + lm[5].y + lm[9].y + lm[13].y + lm[17].y) / 5
        };
        const thumbTipDist = Math.hypot(thumbTip.x - palmCenter.x, thumbTip.y - palmCenter.y);
        const thumbMcpDist = Math.hypot(thumbMcp.x - palmCenter.x, thumbMcp.y - palmCenter.y);
        const isThumbExtended = thumbTipDist > thumbMcpDist * 1.15;

        if (isThumbExtended) {
          count++;
        }

        // Palm spread, normalized by palm size instead of a fixed pixel-space
        // constant, so it works the same whether your hand is close or far.
        const distIndexPinky = Math.hypot(lm[8].x - lm[20].x, lm[8].y - lm[20].y) / palmSize;
        const isOpenPalmSpread = (count >= 4 && distIndexPinky > 2.0);
        const isFist = (count === 0);

        let detectedShape = 'donut';
        let statusText = "";

        if (isOpenPalmSpread) {
          detectedShape = 'saturn';
          statusText = "Gesture: OPEN PALM 🖐️ (Saturn + Zooming In)";
          camera.position.z = Math.max(camera.position.z - 0.4, controls.minDistance);
        } else if (isFist) {
          detectedShape = 'donut';
          statusText = "Gesture: FIST ✊ (Donut + Zooming Out)";
          camera.position.z = Math.min(camera.position.z + 0.4, controls.maxDistance);
        } else {
          switch (count) {
            case 1:
              detectedShape = 'sun';
              statusText = "Gesture: 1 Finger ☝️ (Sun)";
              break;
            case 2:
              detectedShape = 'cube';
              statusText = "Gesture: 2 Fingers ✌️ (Cube)";
              break;
            case 3:
              detectedShape = 'pyramid';
              statusText = "Gesture: 3 Fingers 🤟 (Pyramid)";
              break;
            case 4:
              detectedShape = 'heart';
              statusText = "Gesture: 4 Fingers 🖖 (Heart)";
              break;
            case 5:
              detectedShape = 'saturn';
              statusText = "Gesture: 5 Fingers ✋ (Saturn)";
              break;
            default:
              detectedShape = 'donut';
              statusText = "Gesture: 0 Fingers ✊ (Donut)";
              break;
          }
        }

        status.innerText = statusText;

        // Debounce: require the same reading for a few consecutive frames
        // before actually switching the shape, so a single jittery frame
        // (e.g. a flickering thumb reading) can't flip the model.
        if (detectedShape === pendingShape) {
          pendingCount++;
        } else {
          pendingShape = detectedShape;
          pendingCount = 1;
        }
        if (pendingCount >= DEBOUNCE_FRAMES) {
          switchShape(detectedShape);
        }
      });

      cameraUtils = new Camera(videoElement, {
        onFrame: async () => {
          if (webcamActive) await hands.send({ image: videoElement });
        },
        width: 320,
        height: 240
      });

      cameraUtils.start();
    }

    function setupUIEventListeners() {
      document.getElementById('star-speed').addEventListener('input', (e) => {
        document.getElementById('val-speed').innerText = e.target.value;
      });
      document.getElementById('star-size').addEventListener('input', (e) => {
        document.getElementById('val-size').innerText = e.target.value;
        if (bgStarField) bgStarField.material.size = parseFloat(e.target.value);
      });
      document.getElementById('star-count').addEventListener('change', (e) => {
        document.getElementById('val-count').innerText = e.target.value;
        initBackgroundStars(parseInt(e.target.value));
      });
      document.getElementById('star-color').addEventListener('input', (e) => {
        if (bgStarField) bgStarField.material.color.set(e.target.value);
      });
    }

    function animate() {
      requestAnimationFrame(animate);

      const positions = mainGeometry.attributes.position.array;
      for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
        positions[i] += (targetPositions[i] - positions[i]) * 0.05;
      }
      mainGeometry.attributes.position.needsUpdate = true;

      if (mainParticles) {
        // Continuous auto-rotation accumulators — these always advance,
        // regardless of whether the cursor moves.
        autoRotY += autoRotationSpeedY;
        autoRotX += autoRotationSpeedX;

        // Cursor offset is blended in on TOP of the auto-rotation instead of
        // replacing it, so moving the mouse gently steers the tumble without
        // ever stopping the constant motion.
        cursorOffsetY += (targetRotationY - cursorOffsetY) * 0.03;
        cursorOffsetX += (targetRotationX - cursorOffsetX) * 0.03;

        mainParticles.rotation.y = autoRotY + cursorOffsetY;
        mainParticles.rotation.x = autoRotX + cursorOffsetX;
      }

      if (bgStarField) {
        const starPos = bgStarGeometry.attributes.position.array;
        const speed = parseFloat(document.getElementById('star-speed').value);

        for (let i = 0; i < starPos.length / 3; i++) {
          starPos[i * 3 + 2] += bgStarVelocities[i] * speed * 0.1;

          if (starPos[i * 3 + 2] > 200) {
            starPos[i * 3 + 2] = -200;
            starPos[i * 3]     = (Math.random() - 0.5) * 400;
            starPos[i * 3 + 1] = (Math.random() - 0.5) * 400;
          }
        }
        bgStarGeometry.attributes.position.needsUpdate = true;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    init();
  </script>
</body>
</html>
